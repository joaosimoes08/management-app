services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - keycloak
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/nginx/certs:ro
    profiles: [proxy]
  api:
    environment:
      # The API sits behind exactly one proxy (the nginx above), so trust one X-Forwarded-For hop:
      # anonymous rate limits then key on the real client instead of nginx's address.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
