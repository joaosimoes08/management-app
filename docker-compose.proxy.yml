services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - keycloak
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/nginx/certs:ro
    profiles: [proxy]
