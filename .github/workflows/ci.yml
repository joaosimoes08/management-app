name: CI

on:
  push:
    branches: [main]
  # Manual runs (e.g. on a branch before merge). No pull_request trigger: the repo is public and
  # this uses a self-hosted runner on Joao's Mac, so fork PRs must not be able to run code here.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64]
    # 40, not 20: the 1 GiB ARM runner is slow; run 45210028713 hit the 20-minute cap mid unit tests.
    timeout-minutes: 40
    # The runner (mac-runner-1) is itself a container on Joao's Docker Desktop, so service
    # ports are published on the Mac host, next to the simoes-mgmtapp-* stack (5432, 6379).
    # Use unusual host ports to avoid clashing, and reach them via host.docker.internal:
    # 127.0.0.1 inside the runner container is the runner itself, not the host.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simoes_http_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simoes_http_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:55432/simoes_http_test
      REDIS_URL: redis://host.docker.internal:56379
      AUTH_DISABLED: "false"
      NODE_ENV: test
      # mac-runner-1 is capped at 1 GiB RAM + 1 GiB swap, so node's default heap (~500 MB) is too small
      # for `tsc --noEmit` in apps/web (~700 MB). 1536 fits under the 2 GiB memory+swap ceiling;
      # a larger value would let the container be OOM-killed (taking the runner with it).
      NODE_OPTIONS: --max-old-space-size=1536
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_KEYCLOAK_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: COCiber
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: simoes-web
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @simoes/database db:generate
      - name: Build shared packages
        run: |
          pnpm --filter @simoes/database build
          pnpm --filter @simoes/snmp-core build
      - name: Apply migrations to isolated PostgreSQL
        run: pnpm --filter @simoes/database db:migrate
      - name: Check translations
        run: pnpm i18n:check
      - name: Frontend typecheck
        run: pnpm --filter @simoes/web typecheck
      - name: Frontend lint
        run: pnpm --filter @simoes/web lint
      - name: Backend typecheck
        run: |
          pnpm --filter @simoes/snmp-core exec tsc -p tsconfig.json --noEmit
          pnpm --filter @simoes/api exec tsc -p tsconfig.json --noEmit
          pnpm --filter @simoes/snmp exec tsc -p tsconfig.json --noEmit
      # Types are checked once above, so ts-node only transpiles each spec file (about 5x faster).
      - name: Unit tests
        env:
          TS_NODE_TRANSPILE_ONLY: "true"
        run: |
          pnpm --filter @simoes/snmp-core test
          pnpm --filter @simoes/api test
          pnpm --filter @simoes/snmp test
      - name: HTTP integration tests
        env:
          TS_NODE_TRANSPILE_ONLY: "true"
        run: pnpm test:http
      - name: Build API and web
        run: pnpm build
      - name: Check Bash deployment scripts and guided-flow fixtures
        run: |
          bash -n deploy.sh scripts/test-deploy.sh
          ./scripts/test-deploy.sh

  powershell-syntax:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell Core is available
        run: command -v pwsh
      - name: Parse PowerShell deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
