name: Publish Docker images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch, tag, or commit SHA to build
        required: true
        type: string
      image_tag:
        description: Docker Hub tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish API, web and SNMP images for AMD64 and ARM64
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VCS_REF="$(git rev-parse HEAD)"
          for service in api web snmp; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "apps/$service/Dockerfile" \
              --build-arg VCS_REF="$VCS_REF" \
              --tag "joaosimoes08/mgmt-app-$service:$IMAGE_TAG" \
              --push .
          done
