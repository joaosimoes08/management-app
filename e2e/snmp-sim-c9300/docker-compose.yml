# Simulated Cisco Catalyst C9300 (2-member stack) for Phase 2 SNMP testing. LAB-ONLY.
#   healthy  -> udp ${SIM_BIND:-127.0.0.1}:16161
#   degraded -> udp ${SIM_BIND:-127.0.0.1}:16162
# Both answer SNMPv2c (community lab-public) and SNMPv3 authPriv: user labpoll, SHA "lab-poll-auth-pass",
# AES-128 "lab-poll-priv-pass". These are test-only credentials; never reuse them on a real device.
#   docker compose -f e2e/snmp-sim-c9300/docker-compose.yml up -d --build
#   node e2e/snmp-sim-c9300/walk-check.mjs
#   docker compose -f e2e/snmp-sim-c9300/docker-compose.yml down
name: snmp-sim-c9300

x-sim: &sim
  image: snmp-sim-c9300:local
  build: .
  restart: "no"
  environment: &sim-env
    SIM_COMMUNITY: lab-public
    SIM_V3_USER: labpoll
    SIM_V3_AUTH_KEY: lab-poll-auth-pass
    SIM_V3_PRIV_KEY: lab-poll-priv-pass

services:
  c9300-healthy:
    <<: *sim
    environment:
      <<: *sim-env
      SIM_VARIANT: healthy
    ports:
      - "${SIM_BIND:-127.0.0.1}:16161:1161/udp"

  c9300-degraded:
    <<: *sim
    environment:
      <<: *sim-env
      SIM_VARIANT: degraded
    ports:
      - "${SIM_BIND:-127.0.0.1}:16162:1161/udp"
