server {
  listen 80;
  server_name _;
  client_max_body_size 25m;
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /realms/ { proxy_pass http://keycloak:8080/realms/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /resources/ { proxy_pass http://keycloak:8080/resources/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin/ { proxy_pass http://keycloak:8080/admin/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /js/ { proxy_pass http://keycloak:8080/js/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
